[package]
name = "bomberus"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tracing = "0.1.37"
egui = "0.23.0"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
glob = "0.3.3"

[build-dependencies]
ron = "0.12.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
syn = { version = "2.0.114", features = ["parsing", "full", "extra-traits"] }
quote = "1.0.44"

[dependencies.sdl2]
version = "0.35.2"
default-features = false
features = ["image"]

[dependencies.tracing-tracy]
version = "0.10.2"
default-features = false
features = []
